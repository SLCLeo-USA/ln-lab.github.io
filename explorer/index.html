<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorer — LN-LAB</title>
<meta name="description" content="A random exploration of the great cities of Europe and the Americas — culture, economy, geography, and history.">
<meta name="theme-color" content="#08080a">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

  :root{
    --bg:#08080a;
    --surface:#101014;
    --surface-hover:#16161c;
    --fg:#e8e8ec;
    --muted:#7a7a85;
    --dim:#4a4a54;
    --line:rgba(255,255,255,.07);
    --line-strong:rgba(255,255,255,.14);
    --accent:#8ab4f8;
    --accent-dim:rgba(138,180,248,.12);
    --warm:rgba(255,200,150,.12);
    --cool:rgba(140,180,255,.10);
    --radius:16px;
    --radius-sm:10px;
  }

  html{font-size:16px;scroll-behavior:smooth;}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-weight:300;line-height:1.7;color:var(--fg);background:var(--bg);
    min-height:100vh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    overflow-x:hidden;display:flex;flex-direction:column;align-items:center;
    padding:2rem 1.5rem 3rem;
  }

  .light-field{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .light-field::before,.light-field::after{
    content:"";position:absolute;width:65vmax;height:65vmax;border-radius:50%;
    filter:blur(110px);will-change:transform;
  }
  .light-field::before{
    background:radial-gradient(circle,var(--warm) 0%,transparent 70%);
    top:-22vmax;right:-15vmax;animation:drift-warm 26s ease-in-out infinite alternate;
  }
  .light-field::after{
    background:radial-gradient(circle,var(--cool) 0%,transparent 70%);
    bottom:-22vmax;left:-15vmax;animation:drift-cool 30s ease-in-out infinite alternate;
  }
  @keyframes drift-warm{0%{transform:translate(0,0) scale(1);}100%{transform:translate(-5vmax,4vmax) scale(1.12);}}
  @keyframes drift-cool{0%{transform:translate(0,0) scale(1);}100%{transform:translate(5vmax,-4vmax) scale(1.1);}}

  .shell{position:relative;z-index:1;width:100%;max-width:820px;display:flex;flex-direction:column;gap:1.75rem;}

  /* ── Header ── */
  .header{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:1.5rem;animation:fade-up .9s cubic-bezier(.22,1,.36,1) both;
  }
  .header-left{display:flex;flex-direction:column;gap:.35rem;}
  .mark{
    font-size:.6rem;font-weight:500;letter-spacing:.34em;text-transform:uppercase;
    color:var(--muted);padding-bottom:.65rem;border-bottom:1px solid var(--line);display:inline-block;
  }
  .header h1{font-size:clamp(1.6rem,4vw,2.1rem);font-weight:200;letter-spacing:.01em;line-height:1.25;color:var(--fg);}
  .header h1 em{font-style:normal;color:var(--muted);font-weight:100;}
  .header-sub{font-size:.82rem;font-weight:300;color:var(--muted);max-width:380px;line-height:1.65;}
  .header-right{flex-shrink:0;display:flex;align-items:center;gap:.5rem;padding-top:.3rem;flex-wrap:wrap;justify-content:flex-end;}

  /* ── Buttons ── */
  .btn{
    appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);
    padding:.6rem 1.1rem;border-radius:100px;font-size:.78rem;font-family:inherit;font-weight:400;
    letter-spacing:.02em;cursor:pointer;white-space:nowrap;
    transition:color .25s ease,border-color .25s ease,background .25s ease,transform .2s ease;
    display:inline-flex;align-items:center;gap:.45rem;-webkit-tap-highlight-color:transparent;
  }
  .btn:hover{color:var(--fg);border-color:var(--line-strong);background:var(--surface-hover);}
  .btn:active{transform:scale(.97);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:500;}
  .btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--bg);}
  .btn .arrow{display:inline-block;transition:transform .25s ease;font-size:.9em;}
  .btn:hover .arrow{transform:translateX(2px);}
  .btn-icon{width:38px;height:38px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:.9rem;}

  /* ── Language switch ── */
  .lang-switch{display:inline-flex;border:1px solid var(--line);border-radius:100px;background:var(--surface);overflow:hidden;}
  .lang-btn{
    appearance:none;border:none;background:transparent;color:var(--dim);
    padding:.5rem .8rem;font-size:.7rem;font-family:inherit;font-weight:500;
    letter-spacing:.1em;cursor:pointer;transition:color .25s ease,background .25s ease;
    text-transform:uppercase;
  }
  .lang-btn:hover{color:var(--muted);}
  .lang-btn.active{color:var(--accent);background:var(--accent-dim);}
  .lang-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}

  /* ── Toolbar ── */
  .toolbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;animation:fade-up .9s .1s cubic-bezier(.22,1,.36,1) both;}
  .search-wrap{flex:1;min-width:200px;position:relative;}
  .search-wrap svg{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--dim);pointer-events:none;transition:color .25s ease;}
  .search-wrap:focus-within svg{color:var(--muted);}
  .search{
    width:100%;padding:.65rem .9rem .65rem 2.4rem;font-size:.82rem;font-family:inherit;font-weight:300;
    color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:100px;
    outline:none;transition:border-color .25s ease,background .25s ease;
  }
  .search::placeholder{color:var(--dim);}
  .search:focus{border-color:var(--line-strong);background:var(--surface-hover);}
  .filter-chips{display:flex;gap:.35rem;flex-wrap:wrap;}
  .chip{
    appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);
    padding:.4rem .85rem;border-radius:100px;font-size:.7rem;font-family:inherit;font-weight:400;
    letter-spacing:.04em;cursor:pointer;transition:all .25s ease;white-space:nowrap;
  }
  .chip:hover{color:var(--fg);border-color:var(--line-strong);}
  .chip.active{background:var(--accent-dim);border-color:rgba(138,180,248,.3);color:var(--accent);}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ── Stats ── */
  .stats{
    display:flex;align-items:center;justify-content:space-between;padding:0 .2rem;
    font-size:.72rem;color:var(--dim);letter-spacing:.04em;
    animation:fade-up .9s .15s cubic-bezier(.22,1,.36,1) both;
  }
  .stats-left{display:flex;align-items:center;gap:.5rem;}
  .stats-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px rgba(138,180,248,.5);}

  /* ── Grid ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem;animation:fade-up .9s .2s cubic-bezier(.22,1,.36,1) both;}
  @media (max-width:740px){.grid{grid-template-columns:1fr;}}

  /* ── Card ── */
  .card{
    position:relative;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden;cursor:pointer;
    transition:border-color .35s ease,transform .35s ease,box-shadow .35s ease,background .35s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .card:hover{border-color:var(--line-strong);transform:translateY(-3px);box-shadow:0 16px 48px rgba(0,0,0,.45);background:var(--surface-hover);}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .card.open{transform:none;box-shadow:0 16px 48px rgba(0,0,0,.5);border-color:var(--line-strong);}
  .card.hub{border-color:rgba(138,180,248,.14);}
  .card.hub .card-name::after{
    content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--accent);opacity:.55;margin-left:.45rem;vertical-align:middle;
    box-shadow:0 0 8px rgba(138,180,248,.5);
  }
  .card-front{padding:1.4rem 1.5rem 1.3rem;display:flex;flex-direction:column;gap:.7rem;}
  .card-flag{font-size:1.4rem;line-height:1;filter:grayscale(.3);transition:filter .35s ease,transform .35s ease;}
  .card:hover .card-flag{filter:grayscale(0);transform:scale(1.08);}
  .card-name{font-size:1.15rem;font-weight:300;letter-spacing:.01em;color:var(--fg);line-height:1.3;}
  .card-country{font-size:.75rem;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .card-tagline{
    font-size:.82rem;font-weight:300;color:var(--muted);line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-meta{display:flex;align-items:center;gap:1rem;padding-top:.5rem;border-top:1px solid var(--line);margin-top:.2rem;}
  .meta-item{display:flex;align-items:center;gap:.35rem;font-size:.7rem;color:var(--dim);letter-spacing:.03em;}
  .meta-item svg{width:12px;height:12px;opacity:.6;}
  .card-expand{
    position:absolute;bottom:1rem;right:1.2rem;font-size:.62rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim);transition:color .3s ease,transform .3s ease;
    display:flex;align-items:center;gap:.3rem;
  }
  .card:hover .card-expand{color:var(--accent);transform:translateX(2px);}

  /* ── Card detail ── */
  .card-detail{max-height:0;overflow:hidden;opacity:0;transition:max-height .55s cubic-bezier(.22,1,.36,1),opacity .4s ease;}
  .card.open .card-detail{max-height:1800px;opacity:1;}
  .card-detail-inner{padding:0 1.5rem 1.5rem;display:flex;flex-direction:column;gap:1.2rem;}
  .detail-divider{height:1px;background:var(--line);}

  /* ── Tabs ── */
  .tabs{display:flex;gap:.25rem;flex-wrap:wrap;padding:.2rem 0;}
  .tab{
    appearance:none;border:none;background:transparent;color:var(--dim);
    padding:.45rem .8rem;border-radius:100px;font-size:.68rem;font-family:inherit;font-weight:400;
    letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
    transition:color .25s ease,background .25s ease;white-space:nowrap;
  }
  .tab:hover{color:var(--muted);}
  .tab.active{color:var(--accent);background:var(--accent-dim);}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .tab-panel{display:none;animation:panelIn .3s ease-out both;}
  .tab-panel.active{display:block;}
  @keyframes panelIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .panel-text{font-size:.84rem;font-weight:300;color:var(--muted);line-height:1.8;}

  /* ── Facts ── */
  .fact-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem .8rem;margin-top:.6rem;}
  @media (max-width:500px){.fact-grid{grid-template-columns:1fr;}}
  .fact{
    display:flex;flex-direction:column;gap:.15rem;padding:.55rem .7rem;
    background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:var(--radius-sm);
  }
  .fact-label{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}
  .fact-value{font-size:.82rem;font-weight:400;color:var(--fg);line-height:1.4;}

  /* ── Highlights ── */
  .highlight-list{display:flex;flex-direction:column;gap:.45rem;margin-top:.5rem;}
  .highlight{display:flex;align-items:flex-start;gap:.6rem;font-size:.82rem;color:var(--muted);line-height:1.6;}
  .highlight::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.5;margin-top:.55rem;flex-shrink:0;}

  /* ── Empty ── */
  .empty{grid-column:1/-1;text-align:center;padding:4rem 2rem;color:var(--dim);font-size:.85rem;}
  .empty svg{width:32px;height:32px;margin-bottom:1rem;opacity:.3;}

  /* ── Footer ── */
  .footer{
    position:relative;z-index:1;width:100%;max-width:820px;margin-top:2rem;padding-top:1.5rem;
    border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:.75rem;font-size:.68rem;color:var(--dim);letter-spacing:.06em;
    animation:fade-up .9s .3s cubic-bezier(.22,1,.36,1) both;
  }
  .footer-links{display:flex;gap:1rem;}
  .footer-links a{color:var(--dim);text-decoration:none;transition:color .25s ease;}
  .footer-links a:hover{color:var(--muted);}

  /* ── Toast ── */
  .toast{
    position:fixed;left:50%;bottom:2rem;transform:translate(-50%,12px);
    background:rgba(20,20,24,.92);border:1px solid var(--line);color:var(--fg);
    font-size:.76rem;padding:.6rem 1.2rem;border-radius:100px;opacity:0;pointer-events:none;
    transition:opacity .3s ease,transform .3s ease;z-index:100;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    max-width:80vw;text-align:center;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @keyframes fade-up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  @media (prefers-reduced-motion:reduce){
    .light-field::before,.light-field::after,.header,.toolbar,.stats,.grid,.footer{animation:none;}
    *{transition-duration:.01ms !important;}
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:10px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--dim);}
</style>
</head>

  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    <div class="filter-chips" id="filterChips">

      <button class="chip" data-filter="americas" type="button" data-i18n="filterAmericas"></button>
      <button class="chip" data-filter="hub" type="button" data-i18n="filterHub"></button>
      <button class="chip" data-filter="tier1" type="button" data-i18n="filterTier1"></button>
      <button class="chip" data-filter="tier2" type="button" data-i18n="filterTier2"></button>
    </div>
  </div>

  <div class="stats">
    <div class="stats-left">
      <span class="stats-dot" aria-hidden="true"></span>
      <span id="statsText"></span>
    </div>
    <span id="statsHint"></span>
  </div>

  <div class="grid" id="grid" role="list" aria-label="City cards"></div>

</div>

<footer class="footer">
  <span>© <span id="year"></span> LN-LAB · Enjoy Life. Explore the World.</span>
  <span class="footer-links">

    economy:'旅游、石油天然气，以及不断壮大的科技与创意产业。巴西第二大经济体。',
    geography:'位于大西洋与塞拉多马尔山脉之间，拥有瓜纳巴拉湾与糖面包山。',
    highlights:['救世基督像','糖面包山','科帕卡巴纳海滩','塞拉龙台阶','蒂茹卡森林']
  }
}

];

/* ═══════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════ */

var LANGS = ['en','fr','zh'];
var LANG_KEY = 'ln-lab-explorer-lang';

var state = {
  lang: loadLang(),
  filter: 'all',
  query: '',
  openId: null,
  activeTabs: {}
};

var TAB_NAMES = ['history','culture','economy','geography'];

/* ═══════════════════════════════════════════════════════════════
   UTILITIES
   ═══════════════════════════════════════════════════════════════ */

function $(id){ return document.getElementById(id); }

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function t(key, vars){
  var dict = I18N[state.lang] || I18N.en;
  var str = dict[key];
  if(str == null) str = I18N.en[key] || key;
  if(vars){
    for(var k in vars){
      str = str.replace('{' + k + '}', vars[k]);
    }
  }
  return str;
}

function loadLang(){
  try{
    var saved = localStorage.getItem(LANG_KEY);
    if(saved && LANGS.indexOf(saved) !== -1) return saved;
  }catch(e){}
  // Detect from browser
  var nav = (navigator.language || 'en').toLowerCase();
  if(nav.indexOf('zh') === 0) return 'zh';
  if(nav.indexOf('fr') === 0) return 'fr';
  return 'en';
}

function saveLang(lang){
  try{ localStorage.setItem(LANG_KEY, lang); }catch(e){}
}

function loc(city, field){
  var bundle = city[state.lang] || city.en;
  if(bundle && bundle[field] != null) return bundle[field];
  return city.en[field];
}

var toastTimer = null;
function toast(msg, ms){
  var el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, ms || 2200);
}

/* ═══════════════════════════════════════════════════════════════
   FILTERING
   ═══════════════════════════════════════════════════════════════ */

function getFiltered(){
  var q = state.query.trim().toLowerCase();
  var f = state.filter;

  return CITIES.filter(function(c){
    if(f === 'europe' && c.region !== 'europe') return false;
    if(f === 'americas' && c.region !== 'americas') return false;
    if(f === 'tier1' && c.tier !== 1) return false;
    if(f === 'tier2' && c.tier !== 2) return false;
    if(f === 'hub' && (c.weight || 1) < 1.8) return false;

    if(!q) return true;

    // Search across all three languages so users can type in any of them
    var hay = [];
    for(var L = 0; L < LANGS.length; L++){
      var b = c[LANGS[L]] || c.en;
      hay.push(b.name, b.country, b.tagline, b.history, b.culture, b.economy, b.geography);
      if(b.highlights) hay.push(b.highlights.join(' '));
    }
    return hay.join(' ').toLowerCase().indexOf(q) !== -1;
  });
}

/* ═══════════════════════════════════════════════════════════════
   WEIGHTED RANDOM
   ═══════════════════════════════════════════════════════════════ */

function weightedRandom(cities){
  var total = 0;
  for(var i = 0; i < cities.length; i++) total += (cities[i].weight || 1);

  var r = Math.random() * total;
  var acc = 0;
  for(var j = 0; j < cities.length; j++){
    acc += (cities[j].weight || 1);
    if(r <= acc) return cities[j];
  }
  return cities[cities.length - 1];
}

/* ═══════════════════════════════════════════════════════════════
   RENDERING
   ═══════════════════════════════════════════════════════════════ */

function fact(label, value){
  return '<div class="fact">' +
    '<span class="fact-label">' + esc(label) + '</span>' +
    '<span class="fact-value">' + esc(value) + '</span>' +
  '</div>';
}

function buildTabPanels(c){
  var html = '';
  var activeTab = state.activeTabs[c.id] || 'history';

  var tabKeys = {
    history: 'tabHistory',
    culture: 'tabCulture',
    economy: 'tabEconomy',
    geography: 'tabGeography'
  };

  for(var i = 0; i < TAB_NAMES.length; i++){
    var name = TAB_NAMES[i];
    var isActive = activeTab === name;
    var content = loc(c, name) || '';

    html += '<div class="tab-panel' + (isActive ? ' active' : '') + '" data-panel="' + name + '">';
    html += '<p class="panel-text">' + esc(content) + '</p>';

    if(name === 'history'){
      html += '<div class="fact-grid">';
      html += fact(t('factFounded'), loc(c,'founded'));
      html += fact(t('factPopulation'), c.population);
      html += fact(t('factArea'), c.area);
      html += fact(t('factLanguage'), loc(c,'language'));
      html += '</div>';
    }

    if(name === 'economy'){
      html += '<div class="fact-grid">';
      html += fact(t('factGdp'), c.gdp);
      html += fact(t('factCurrency'), c.region === 'europe' ? t('currencyEurope') : t('currencyAmericas'));
      html += '</div>';
    }

    if(name === 'geography'){
      html += '<div class="fact-grid">';
      html += fact(t('factCoordinates'), c.coords);
      html += fact(t('factRegion'), c.region === 'europe' ? t('regionEurope') : t('regionAmericas'));
      html += '</div>';
    }

    if(name === 'culture'){
      var highlights = loc(c, 'highlights') || [];
      html += '<div class="highlight-list">';
      for(var h = 0; h < highlights.length; h++){
        html += '<div class="highlight">' + esc(highlights[h]) + '</div>';
      }
      html += '</div>';
    }

    html += '</div>';
  }

  return html;
}

function buildTabs(c){
  var active = state.activeTabs[c.id] || 'history';
  var tabKeys = ['tabHistory','tabCulture','tabEconomy','tabGeography'];
  var html = '<div class="tabs" role="tablist">';

  for(var i = 0; i < TAB_NAMES.length; i++){
    var name = TAB_NAMES[i];
    html += '<button class="tab' + (active === name ? ' active' : '') +
            '" data-tab="' + name + '" role="tab" type="button">' +
            esc(t(tabKeys[i])) + '</button>';
  }

  html += '</div>';
  return html;
}

function buildCard(c){
  var isOpen = state.openId === c.id;
  var tierLabel = c.tier === 1 ? t('tier1') : t('tier2');
  var isHub = (c.weight || 1) >= 1.8;

  var html = '<article class="card' + (isOpen ? ' open' : '') + (isHub ? ' hub' : '') +
             '" data-id="' + esc(c.id) + '" role="listitem" tabindex="0">';

  html += '<div class="card-front">';
  html += '<div class="card-flag">' + c.flag + '</div>';
  html += '<div class="card-name">' + esc(loc(c,'name')) + '</div>';
  html += '<div class="card-country">' + esc(loc(c,'country')) + ' · ' + tierLabel + '</div>';
  html += '<div class="card-tagline">' + esc(loc(c,'tagline')) + '</div>';
  html += '<div class="card-meta">';
  html += '<span class="meta-item">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>' +
    esc(c.region === 'europe' ? t('regionEurope') : t('regionAmericas')) + '</span>';
  html += '<span class="meta-item">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>' +
    esc(c.population) + '</span>';
  html += '</div>';
  html += '<span class="card-expand">' + esc(t('explore')) + ' <span aria-hidden="true">↓</span></span>';
  html += '</div>';

  html += '<div class="card-detail">';
  html += '<div class="card-detail-inner">';
  html += '<div class="detail-divider"></div>';
  html += buildTabs(c);
  html += buildTabPanels(c);
  html += '</div>';
  html += '</div>';

  html += '</article>';

  return html;
}

function render(){
  var grid = $('grid');
  var filtered = getFiltered();

  if(filtered.length === 0){
    grid.innerHTML =
      '<div class="empty">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
        '<div>' + esc(t('empty')) + '</div>' +
      '</div>';
  } else {
    var html = '';
    for(var i = 0; i < filtered.length; i++){
      html += buildCard(filtered[i]);
    }
    grid.innerHTML = html;
  }

  var total = CITIES.length;
  var shown = filtered.length;
  $('statsText').textContent = t('statsOf', { shown: shown, total: total });

  var openName = '';
  if(state.openId){
    for(var j = 0; j < CITIES.length; j++){
      if(CITIES[j].id === state.openId){ openName = loc(CITIES[j], 'name'); break; }
    }
  }
  $('statsHint').textContent = openName ? t('hintExploring', { name: openName }) : t('hintExpand');
}

/* ═══════════════════════════════════════════════════════════════
   GRID EVENTS
   ═══════════════════════════════════════════════════════════════ */

function bindGrid(){
  var grid = $('grid');

  grid.addEventListener('click', function(e){
    var card = e.target.closest('.card');
    if(!card) return;
    var id = card.getAttribute('data-id');
    if(!id) return;

    var tab = e.target.closest('.tab');
    if(tab){
      e.stopPropagation();
      var tabName = tab.getAttribute('data-tab');
      state.activeTabs[id] = tabName;

      var tabs = card.querySelectorAll('.tab');
      for(var i = 0; i < tabs.length; i++){
        tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === tabName);
      }
      var panels = card.querySelectorAll('.tab-panel');
      for(var j = 0; j < panels.length; j++){
        panels[j].classList.toggle('active', panels[j].getAttribute('data-panel') === tabName);
      }
      return;
    }

    if(state.openId === id){
      state.openId = null;
      card.classList.remove('open');
      $('statsHint').textContent = t('hintExpand');
    } else {
      var prev = grid.querySelector('.card.open');
      if(prev) prev.classList.remove('open');

      state.openId = id;
      card.classList.add('open');

      var cityName = '';
      for(var k = 0; k < CITIES.length; k++){
        if(CITIES[k].id === id){ cityName = loc(CITIES[k], 'name'); break; }
      }
      $('statsHint').textContent = t('hintExploring', { name: cityName });
    }
  });

  grid.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var card = e.target.closest('.card');
    if(!card) return;
    e.preventDefault();
    card.click();
  });
}

/* ═══════════════════════════════════════════════════════════════
   RANDOM
   ═══════════════════════════════════════════════════════════════ */

function randomCity(){
  var filtered = getFiltered();
  if(filtered.length === 0){ toast(t('toastNoCities')); return; }

  var pick = weightedRandom(filtered);

  var prev = $('grid').querySelector('.card.open');
  if(prev) prev.classList.remove('open');

  state.openId = pick.id;
  render();

  requestAnimationFrame(function(){
    var el = $('grid').querySelector('[data-id="' + pick.id + '"]');
    if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  var hubMark = (pick.weight || 1) >= 2.5 ? t('toastHub') : '';
  toast(t('toastExploring', { name: loc(pick,'name'), country: loc(pick,'country') }) + hubMark);
}

/* ═══════════════════════════════════════════════════════════════
   I18N UI APPLY
   ═══════════════════════════════════════════════════════════════ */

function applyLangToUI(){
  // Document title & lang attribute
  document.documentElement.setAttribute('lang', state.lang === 'zh' ? 'zh-CN' : state.lang);

  // Page title
  $('pageTitle').innerHTML = esc(t('pageTitle')) + '<br><em>' + esc(t('pageTitleSub')) + '</em>';
  $('pageSub').textContent = t('pageSub');

  // Random button
  $('randomBtn').querySelector('[data-i18n="random"]').textContent = t('random');

  // Shuffle aria-label
  $('shuffleBtn').setAttribute('aria-label', t('clearFilters'));
  $('shuffleBtn').setAttribute('title', t('clearFilters'));

  // Search placeholder
  $('searchInput').setAttribute('placeholder', t('searchPlaceholder'));

  // Filter chips
  var chips = $('filterChips').querySelectorAll('.chip');
  var chipKeys = {
    all: 'filterAll', europe: 'filterEurope', americas: 'filterAmericas',
    hub: 'filterHub', tier1: 'filterTier1', tier2: 'filterTier2'
  };
  for(var i = 0; i < chips.length; i++){
    var key = chipKeys[chips[i].getAttribute('data-filter')];
    if(key) chips[i].textContent = t(key);
  }

  // Footer contact
  $('contactLink').textContent = t('contact');

  // Language buttons
  var langBtns = $('langSwitch').querySelectorAll('.lang-btn');
  for(var L = 0; L < langBtns.length; L++){
    langBtns[L].classList.toggle('active', langBtns[L].getAttribute('data-lang') === state.lang);
  }
}

/* ═══════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════ */

function init(){
  $('year').textContent = new Date().getFullYear();

  for(var i = 0; i < CITIES.length; i++){
    state.activeTabs[CITIES[i].id] = 'history';
  }

  applyLangToUI();
  render();
  bindGrid();

  /* Search */
  var searchTimer = null;
  $('searchInput').addEventListener('input', function(e){
    var val = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){
      state.query = val;
      render();
    }, 180);
  });

  /* Filter chips */
  $('filterChips').addEventListener('click', function(e){
    var chip = e.target.closest('.chip');
    if(!chip) return;
    state.filter = chip.getAttribute('data-filter');
    state.openId = null;
    var chips = $('filterChips').querySelectorAll('.chip');
    for(var i = 0; i < chips.length; i++){
      chips[i].classList.toggle('active', chips[i] === chip);
    }
    render();
  });

  /* Random */
  $('randomBtn').addEventListener('click', randomCity);

  /* Clear filters */
  $('shuffleBtn').addEventListener('click', function(){
    state.filter = 'all';
    state.query = '';
    state.openId = null;
    $('searchInput').value = '';
    var chips = $('filterChips').querySelectorAll('.chip');
    for(var i = 0; i < chips.length; i++){
      chips[i].classList.toggle('active', chips[i].getAttribute('data-filter') === 'all');
    }
    render();
    toast(t('toastCleared'));
  });

  /* Language switch */
  $('langSwitch').addEventListener('click', function(e){
    var btn = e.target.closest('.lang-btn');
    if(!btn) return;
    var lang = btn.getAttribute('data-lang');
    if(lang === state.lang) return;

    state.lang = lang;
    saveLang(lang);
    applyLangToUI();
    render();
  });

  /* Keyboard: R for random */
  document.addEventListener('keydown', function(e){
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if(e.key === 'r' || e.key === 'R'){
      if(!e.ctrlKey && !e.metaKey && !e.altKey) randomCity();
    }
  });
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
