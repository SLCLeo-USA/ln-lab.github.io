<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LN-LAB — Enjoy Life. Explore the World.</title>
  <meta name="description" content="LN-LAB is a small studio exploring the aesthetics of light, reflection, refraction, and the quiet wonder of everyday things.">

  <!-- Set theme before paint to avoid flash -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <style>
    /* ============================================================
       Reset & base
       ============================================================ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #fafafa;
      --fg: #18181b;
      --muted: #8b8b92;
      --line: #e6e6e9;
      --surface: rgba(255, 255, 255, 0.55);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      --glow-warm: rgba(255, 214, 170, 0.32);
      --glow-cool: rgba(170, 205, 255, 0.26);
      --btn-hover: #18181b;
      --btn-hover-fg: #fafafa;
    }

    [data-theme="dark"] {
      --bg: #0b0b0d;
      --fg: #ededf0;
      --muted: #78787f;
      --line: #222226;
      --surface: rgba(255, 255, 255, 0.03);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      --glow-warm: rgba(255, 170, 100, 0.10);
      --glow-cool: rgba(120, 160, 255, 0.10);
      --btn-hover: #ededf0;
      --btn-hover-fg: #0b0b0d;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
        Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-weight: 300;
      line-height: 1.7;
      color: var(--fg);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* ============================================================
       Ambient light field — the quiet refraction layer
       ============================================================ */
    .light-field {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .light-field::before,
    .light-field::after {
      content: "";
      position: absolute;
      width: 72vmax;
      height: 72vmax;
      border-radius: 50%;
      filter: blur(100px);
      will-change: transform;
      transition: background 0.6s ease, opacity 0.6s ease;
    }

    .light-field::before {
      background: radial-gradient(circle, var(--glow-warm) 0%, transparent 70%);
      top: -28vmax;
      right: -18vmax;
      animation: drift-warm 24s ease-in-out infinite alternate;
    }

    .light-field::after {
      background: radial-gradient(circle, var(--glow-cool) 0%, transparent 70%);
      bottom: -28vmax;
      left: -18vmax;
      animation: drift-cool 28s ease-in-out infinite alternate;
    }

    @keyframes drift-warm {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-6vmax, 5vmax) scale(1.14); }
    }

    @keyframes drift-cool {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(6vmax, -5vmax) scale(1.12); }
    }

    /* ============================================================
       Theme toggle
       ============================================================ */
    .theme-toggle {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 10;
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: color 0.3s ease, border-color 0.3s ease, background 0.3s ease,
        transform 0.3s ease;
    }

    .theme-toggle:hover {
      color: var(--fg);
      border-color: var(--fg);
      transform: scale(1.06);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 3px;
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .icon-sun { display: none; }
    [data-theme="dark"] .icon-moon { display: none; }
    [data-theme="dark"] .icon-sun  { display: block; }

    /* ============================================================
       Main content
       ============================================================ */
    .main {
      position: relative;
      z-index: 1;
      flex: 1;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 0;
      animation: fade-up 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Brand mark ---------- */
    .mark {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2.6rem;
      padding-bottom: 0.9rem;
      border-bottom: 1px solid var(--line);
    }

    /* ---------- Headline ---------- */
    h1 {
      font-size: clamp(2.1rem, 7.5vw, 3.1rem);
      font-weight: 200;
      letter-spacing: 0.01em;
      line-height: 1.24;
      color: var(--fg);
      margin-bottom: 1.8rem;
    }

    h1 .thin {
      font-weight: 100;
      color: var(--muted);
      display: block;
    }

    /* ---------- Tagline ---------- */
    .tagline {
      font-size: 0.95rem;
      font-weight: 300;
      line-height: 1.9;
      color: var(--muted);
      max-width: 440px;
      margin: 0 auto;
    }

    .tagline .keyword {
      font-weight: 400;
      color: var(--fg);
    }

    /* ---------- Actions ---------- */
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 2.8rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      padding: 0.85rem 1.9rem;
      border-radius: 100px;
      text-decoration: none;
      border: 1px solid transparent;
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease,
        transform 0.3s ease, box-shadow 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 3px;
    }

    .btn-primary {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      opacity: 0.92;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--fg);
      border-color: var(--line);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .btn-secondary:hover {
      border-color: var(--fg);
      background: var(--btn-hover);
      color: var(--btn-hover-fg);
      transform: translateY(-2px);
    }

    .btn .arrow {
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .btn:hover .arrow {
      transform: translateX(3px);
    }

    /* ============================================================
       Footer
       ============================================================ */
    .footer {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      text-align: center;
      padding: 2rem 0 0.5rem;
      border-top: 1px solid var(--line);
    }

    .footer .copyright {
      font-size: 0.74rem;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .footer .footer-note {
      font-size: 0.66rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.65;
      margin-top: 0.5rem;
    }

    /* ============================================================
       Responsive
       ============================================================ */
    @media (max-width: 520px) {
      body {
        padding: 1.4rem;
      }

      .theme-toggle {
        top: 1rem;
        right: 1rem;
        width: 38px;
        height: 38px;
      }

      .mark {
        margin-bottom: 2rem;
        letter-spacing: 0.28em;
      }

      .main {
        padding: 2rem 0;
      }

      .actions {
        margin-top: 2.2rem;
        flex-direction: column;
        width: 100%;
      }

      .btn {
        width: 100%;
        justify-content: center;
        padding: 0.9rem 1.5rem;
      }

      .footer {
        padding-top: 1.6rem;
      }
    }

    /* ============================================================
       Reduced motion
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      .light-field::before,
      .light-field::after,
      .main {
        animation: none;
      }

      * {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient light / refraction field -->
  <div class="light-field" aria-hidden="true"></div>

  <!-- Theme toggle -->
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
    <!-- Moon (shown in light mode) -->
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <!-- Sun (shown in dark mode) -->
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2v2.2M12 19.8V22M4.22 4.22l1.56 1.56M18.22 18.22l1.56 1.56M2 12h2.2M19.8 12H22M4.22 19.78l1.56-1.56M18.22 5.78l1.56-1.56"/>
    </svg>
  </button>

  <!-- Main content -->
  <main class="main">

    <span class="mark">LN-LAB</span>

    <h1>
      Enjoy Life.
      <span class="thin">Explore the World.</span>
    </h1>

    <p class="tagline">
      LN-LAB is a small studio devoted to the <span class="keyword">aesthetics of light</span> —
      reflection, refraction, shadow, and the quiet wonder of everyday things.
    </p>

    <div class="actions">
      <a
        class="btn btn-primary"
        href="https://ln-lab.github.io/list"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Enter the List — opens in a new tab"
      >
        Enter the List
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a
        class="btn btn-secondary"
        href="https://slcleo-usa.github.io"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Contact Us — opens in a new tab"
      >
        Contact Us
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <p class="copyright">
      © <span id="year">2026</span> LN-LAB. All rights reserved.
    </p>
    <p class="footer-note">Independent Aesthetics &amp; Exploration</p>
  </footer>

  <!-- Scripts -->
  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('themeToggle');

      // Sync aria-label with current theme
      function syncLabel() {
        var isDark = root.getAttribute('data-theme') === 'dark';
        btn.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
      }

      // Toggle theme
      btn.addEventListener('click', function () {
        var current = root.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try {
          localStorage.setItem('theme', next);
        } catch (e) {}
        syncLabel();
      });

      syncLabel();

      // Dynamic copyright year
      var yearEl = document.getElementById('year');
      if (yearEl) {
        yearEl.textContent = new Date().getFullYear();
      }
    })();
  </script>

</body>
</html>
